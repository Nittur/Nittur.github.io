<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Pavan's reviews of movies, food, items, and more">
    <title>Reviews | Pavan</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="js/reviews.js" defer></script>
</head>

<body>
    <!-- Background decorations -->
    <div class="bg-decoration">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="wave-pattern"></div>
    </div>

    <!-- Navigation -->
    <nav class="main-nav">
        <a href="index.html" class="nav-logo">
            <span class="logo-symbol">⛩</span>
            <span class="logo-text">Pavan</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="reviews.html" class="active">Reviews</a></li>
            <li><a href="blogs.html">Blog</a></li>
        </ul>
    </nav>

    <main class="container">
        
        <!-- Page Header -->
        <section class="page-header">
            <span class="cherry-blossom header-blossom">✿</span>
            <h1 class="hero-title">
                My <span class="gradient-text">Reviews</span>
            </h1>
            <p class="hero-subtitle">
                <span class="retro-text">// movies, games, and everything in between</span>
            </p>
        </section>

        <!-- Category Buttons — built dynamically from loaded .md files -->
        <div class="category-bar" id="category-bar"></div>

        <!-- Reviews Container -->
        <section class="reviews-section" id="reviews-section" style="display: none;">
            <h2 class="category-title" id="category-title"></h2>
            <div class="reviews-list" id="reviews-container">
                <!-- Reviews will be rendered here by JavaScript -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p class="footer-text">
            <span class="retro-text">2026</span>
            <span class="footer-divider">◈</span>
            <span class="retro-text">made with ♡</span>
        </p>
    </footer>

</body>
</html>
