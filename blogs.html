<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0D0D0D">
    <meta name="description" content="SINGULARITY — thoughts, tools, and ideas">
    <title>Blog | SINGULARITY</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%A9%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="js/blogs.js" defer></script>
</head>

<body class="blogs-page">
    <!-- Background decorations -->
    <div class="bg-decoration">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="wave-pattern"></div>
    </div>

    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">
                <span class="logo-symbol">⛩</span>
                <span class="logo-text">SINGULARITY</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="blogs.html" class="active">Blog</a></li>
            </ul>
        </div>
    </nav>

    <!-- ── LISTING VIEW ──────────────────────── -->
    <main class="container" id="view-listing">
        <section class="page-header">
            <span class="leaf header-leaf" role="img" aria-label="Black hole horizon"></span>
            <h1 class="hero-title">
                <span class="gradient-text">Blog</span>
            </h1>
            <p class="hero-subtitle">
                <span class="retro-text">thoughts, tools, and half-formed ideas</span>
            </p>
        </section>

        <!-- Genre tabs — built from content/blogs/genres.md -->
        <nav class="genre-bar" id="genre-bar" aria-label="Blog genres" hidden></nav>
        <p class="genre-info" id="genre-info" hidden></p>

        <!-- Posts — layout (cards | list | grid) comes from the genre -->
        <div class="blog-listing" id="blog-listing" data-layout="cards">
            <div class="blog-loading">
                <span class="retro-text blog-loading-text">loading posts...</span>
            </div>
        </div>
    </main>

    <!-- ── READER VIEW ───────────────────────── -->
    <main class="container" id="view-reader" style="display:none;">
        <article class="blog-post" id="blog-post">
            <button type="button" class="blog-back-btn" id="back-btn">← All Posts</button>

            <!-- Banner image (shown if post has one) -->
            <div class="blog-banner" id="blog-banner" hidden>
                <img id="blog-banner-img" src="data:," alt="" class="blog-banner-img">
            </div>

            <header class="blog-post-header">
                <h1 class="blog-post-title" id="post-title"></h1>
                <div class="blog-post-meta" id="post-meta">
                    <span class="post-genre" id="post-genre"></span>
                    <span class="post-dot">·</span>
                    <time class="post-date" id="post-date"></time>
                    <span class="post-dot">·</span>
                    <span class="post-readtime" id="post-readtime"></span>
                    <span class="post-dot" id="post-tags-dot">·</span>
                    <div class="post-tags" id="post-tags"></div>
                </div>
            </header>

            <!-- Rendered markdown content -->
            <div class="blog-content" id="blog-content"></div>

            <footer class="blog-post-footer">
                <button type="button" class="blog-back-btn" id="back-btn-footer">← All Posts</button>
            </footer>
        </article>
    </main>
</body>
</html>
