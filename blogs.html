<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Pavan's blog - thoughts, tools, and ideas">
    <title>Blog | Pavan</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="js/blogs.js" defer></script>
</head>

<body>
    <!-- Background decorations -->
    <div class="bg-decoration">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="wave-pattern"></div>
    </div>

    <!-- Navigation -->
    <nav class="main-nav">
        <a href="index.html" class="nav-logo">
            <span class="logo-symbol">⛩</span>
            <span class="logo-text">Pavan</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="reviews.html">Reviews</a></li>
            <li><a href="blogs.html" class="active">Blog</a></li>
        </ul>
    </nav>

    <!-- ── LISTING VIEW ──────────────────────── -->
    <main class="container" id="view-listing">
        <section class="page-header">
            <span class="cherry-blossom header-blossom">✿</span>
            <h1 class="hero-title">
                <span class="gradient-text">Blog</span>
            </h1>
            <p class="hero-subtitle">
                <span class="retro-text">// thoughts, tools, and half-formed ideas</span>
            </p>
        </section>

        <div class="blog-listing" id="blog-listing">
            <!-- Cards injected here -->
            <div class="blog-loading">
                <span class="retro-text blog-loading-text">// loading posts...</span>
            </div>
        </div>
    </main>

    <!-- ── READER VIEW ───────────────────────── -->
    <main class="container" id="view-reader" style="display:none;">
        
        <!-- Banner image (shown if post has one) -->
        <div class="blog-banner" id="blog-banner" style="display:none;">
            <img id="blog-banner-img" src="" alt="" class="blog-banner-img">
        </div>

        <article class="blog-post" id="blog-post">
            <!-- Post header -->
            <header class="blog-post-header">
                <button class="blog-back-btn" id="back-btn">← All Posts</button>
                <h1 class="blog-post-title" id="post-title"></h1>
                <div class="blog-post-meta" id="post-meta">
                    <span class="post-date" id="post-date"></span>
                    <span class="post-dot">·</span>
                    <span class="post-readtime" id="post-readtime"></span>
                    <span class="post-dot">·</span>
                    <div class="post-tags" id="post-tags"></div>
                </div>
            </header>

            <!-- Rendered markdown content -->
            <div class="blog-content" id="blog-content"></div>

            <!-- Post footer -->
            <footer class="blog-post-footer">
                <button class="blog-back-btn" id="back-btn-footer">← All Posts</button>
            </footer>
        </article>
    </main>

    <footer class="main-footer" id="site-footer">
        <p class="footer-text">
            <span class="retro-text">2026</span>
            <span class="footer-divider">◈</span>
            <span class="retro-text">made with ♡</span>
        </p>
    </footer>

</body>
</html>
