<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ============================================
         META TAGS - Essential information for browsers
         ============================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0D0D0D">
    <meta name="description" content="SINGULARITY — a blend of optimistic futurism and zen">
    <title>Diving into Singularity</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%A9%3C/text%3E%3C/svg%3E">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="home-page">
    <!-- ============================================
         DECORATIVE BACKGROUND ELEMENTS
         Floating shapes + Japanese wave pattern
         ============================================ -->
    <div class="bg-decoration">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        
        <!-- Japanese wave pattern (seigaiha) at bottom -->
        <div class="wave-pattern"></div>
    </div>

    <!-- ============================================
         NAVIGATION BAR
         ============================================ -->
    <nav class="main-nav">
        <div class="nav-inner">
            <!-- Logo with Torii Gate symbol (⛩) - Japanese cultural icon -->
            <a href="index.html" class="nav-logo">
                <span class="logo-symbol">⛩</span>
                <span class="logo-text">SINGULARITY</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="blogs.html">Blog</a></li>
            </ul>
        </div>
    </nav>

    <!-- ============================================
         BENTO GRID — 4 cols × 3 rows on desktop
                       2 cols × 3 rows on mobile
         ============================================ -->
    <main class="bento-grid">

        <!-- ── Hero tile (col 1-2, row 1-2) ── -->
        <div class="bento-tile tile-hero">
            <span class="leaf" role="img" aria-label="Black hole horizon"></span>
            <h1 class="hero-title">
                Diving into
                <span class="gradient-text">Singularity</span>
            </h1>
            <p class="hero-subtitle">
                <span class="retro-text">exploring ideas, one day at a time</span>
            </p>
            <p class="about-text-compact">
                If interested to discuss, mail me.
            </p>
        </div>

        <!-- ── Motto tile (col 3-4, row 1-2) ── -->
        <div class="bento-tile tile-gif">
            <p class="cogito-text">COGITO ERGO SUM</p>
        </div>

        <!-- ── About tile (col 1, row 3) ── -->
        <div class="bento-tile tile-about">
            <span class="tile-icon">👾</span>
            <span class="tile-label retro-text">who i am</span>
            <p class="tile-body">CS student. Eternal thinker. Loves to ideate and build.</p>
        </div>

        <!-- ── Blog tile (col 2, row 3) ── -->
        <a href="blogs.html" class="bento-tile tile-blog">
            <span class="tile-icon">✍️</span>
            <span class="tile-label">Blog</span>
            <span class="tile-arrow">→</span>
        </a>

        <!-- ── Reviews tile (col 3, row 3) ── -->
        <a href="reviews.html" class="bento-tile tile-reviews">
            <span class="tile-icon">⭐</span>
            <span class="tile-label">Reviews</span>
            <span class="tile-arrow">→</span>
        </a>

        <!-- ── Footer tile (col 4, row 3) ── -->
        <!-- Black hole scene — built only from CSS gradient patterns.
             Planets spiral in and vanish past the horizon (see .bh-* in styles.css). -->
        <div class="bento-tile tile-footer">
            <div class="bh-scene" role="img" aria-label="A black hole pulling in planets and star dust">
                <div class="bh-stars"></div>
                <div class="bh-swirl"></div>
                <div class="bh-disk bh-disk-back"></div>
                <div class="bh-core"></div>
                <div class="bh-disk bh-disk-front"></div>
                <span class="bh-planet bh-p1"></span>
                <span class="bh-planet bh-p2"></span>
                <span class="bh-planet bh-p3"></span>
                <span class="bh-planet bh-p4"></span>
            </div>
        </div>

    </main>

</body>
</html>
